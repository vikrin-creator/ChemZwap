name: Deploy to Hostinger

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci --prefer-offline --no-audit
        
    - name: Build Vite app
      working-directory: ./frontend
      run: npm run build
      env:
        CI: false
        GENERATE_SOURCEMAP: false
        VITE_API_URL: https://www.chemzwap.com/api
        
    # Deploy Frontend to public_html
    - name: Deploy Frontend to Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.HOSTINGER_FTP_SERVER }}
        username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
        password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        local-dir: ./frontend/dist/
        server-dir: /public_html/
        protocol: ftp
        port: 21
        timeout: 600000
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          
    # Setup PHP
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        
    # Install PHP dependencies
    - name: Install Composer dependencies
      working-directory: ./backend-php
      run: |
        composer install --no-dev --optimize-autoloader --no-interaction

    # Create .env file with production values
    - name: Create backend .env file
      run: |
        cat > ./backend-php/.env << 'ENVEOF'
        DB_HOST=localhost
        DB_USER=u177524058_Chemzwap
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        DB_NAME=u177524058_Chemzwap
        JWT_SECRET=chemzwap_secret_key_2024
        EMAIL_USER=${{ secrets.EMAIL_USER }}
        EMAIL_PASS=${{ secrets.EMAIL_PASS }}
        ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
        API_URL=https://www.chemzwap.com/api
        APP_ENV=production
        DISPLAY_ERRORS=0
        ALLOWED_ORIGINS=https://www.chemzwap.com
        ENVEOF

    # Deploy Backend PHP to public_html/api
    - name: Deploy Backend PHP to Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.HOSTINGER_FTP_SERVER }}
        username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
        password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        local-dir: ./backend-php/
        server-dir: /public_html/api/
        protocol: ftp
        port: 21
        timeout: 600000
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/vendor/**
